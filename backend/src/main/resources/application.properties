# Spring Boot Configuration - AICTE APAAR Platform
server.port=8085

# Application Details
spring.application.name=apaar-verify-backend

# H2 Database Configuration (Fast, zero-setup, in-memory)
spring.datasource.url=jdbc:h2:mem:apaardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Event Stream Configuration (local simulated broker for anomaly events)
spring.kafka.bootstrap-servers=localhost:9092
aicte.kafka.duplicate-topic=aicte.apaar.duplicate-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Logging
logging.level.gov.aicte=INFO
logging.level.org.springframework.security=WARN
