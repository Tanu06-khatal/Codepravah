services:
  # AICTE APAAR Backend - Spring Boot 3 + Java 21 Web Service
  - type: web
    name: apaar-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/college/stats
    envVars:
      - key: PORT
        value: 8085

  # AICTE APAAR Frontend - Angular 21 Static Site
  - type: web
    name: apaar-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/frontend/browser
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

